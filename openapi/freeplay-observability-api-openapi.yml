openapi: 3.2.0
info:
  title: Freeplay Observability API
  version: 0.1.0
security:
- BearerAuth: []
tags:
- name: Observability
paths:
  /api/v2/projects/{project_id}/sessions/id/{session_id}/metadata:
    patch:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  message:
                    title: Message
                    type: string
                required:
                - message
                title: SimpleResponseWithMessage
                type: object
          description: 'SimpleResponseWithMessage(message: str)'
      description: Merge custom metadata into an existing session. Use to enrich sessions with post-hoc context like user ID or business metrics. See SDK method.
      summary: Update Session Metadata
      tags:
      - Observability
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                anyOf:
                - type: string
                - type: number
                - type: integer
                - type: boolean
              type: object
      operationId: patch_update_session_metadata
  /api/v2/projects/{project_id}/sessions/{session_id}:
    delete:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      responses: {}
      description: Permanently delete a session and all associated completions. Use when removing test data or honoring data deletion requests.
      summary: Delete Session
      tags:
      - Observability
      operationId: delete_delete_session
  /api/v2/projects/{project_id}/sessions/{session_id}/completions:
    post:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  completion_id:
                    description: The session entry ID
                    format: uuid
                    title: Completion Id
                    type: string
                required:
                - completion_id
                title: RecordCompletionInfo
                type: object
          description: 'RecordCompletionInfo(completion_id: uuid.UUID = FieldInfo(annotation=NoneType, required=True, description=''The session entry ID''))'
      description: 'Log an LLM completion with its prompt, response, and metadata. This is the primary endpoint for observability. See SDK method.


        Sessions are created implicitly—just generate a session_id client-side (UUID v4). Optionally provide your own completion_id too to avoid waiting for Freeplay''s response.'
      summary: Record Completion
      tags:
      - Observability
      requestBody:
        content:
          application/json:
            schema:
              properties:
                messages:
                  anyOf:
                  - items:
                      discriminator:
                        mapping:
                          assistant: '#/components/schemas/OpenAIAssistantMessage'
                          developer: '#/components/schemas/OpenAIDeveloperMessage'
                          system: '#/components/schemas/OpenAISystemMessage'
                          tool: '#/components/schemas/OpenAIToolMessage'
                          user: '#/components/schemas/OpenAIUserMessage'
                        propertyName: role
                      oneOf:
                      - $ref: '#/components/schemas/OpenAISystemMessage'
                      - $ref: '#/components/schemas/OpenAIDeveloperMessage'
                      - $ref: '#/components/schemas/OpenAIUserMessage'
                      - $ref: '#/components/schemas/OpenAIAssistantMessage'
                      - $ref: '#/components/schemas/OpenAIToolMessage'
                    type: array
                  - items:
                      $ref: '#/components/schemas/AnthropicMessage'
                    type: array
                  - items:
                      $ref: '#/components/schemas/SimpleProviderMessage'
                    type: array
                  - items:
                      $ref: '#/components/schemas/VertexMessage'
                    type: array
                  - items:
                      $ref: '#/components/schemas/BedrockConverseMessage'
                    type: array
                  - items:
                      anyOf:
                      - oneOf:
                        - $ref: '#/components/schemas/OpenAIResponsesMessageItem'
                        - $ref: '#/components/schemas/OpenAIResponsesFunctionCallItem'
                        - $ref: '#/components/schemas/OpenAIResponsesFunctionCallOutputItem'
                        - $ref: '#/components/schemas/OpenAIResponsesReasoningItem'
                        - $ref: '#/components/schemas/OpenAIResponsesBuiltinToolItem'
                      - $ref: '#/components/schemas/SimpleProviderMessage'
                    type: array
                  title: Messages
                inputs:
                  default: null
                  title: Inputs
                  additionalProperties:
                    $ref: '#/components/schemas/InputVariable'
                  type:
                  - object
                  - 'null'
                media_inputs:
                  default: null
                  title: Media Inputs
                  additionalProperties:
                    discriminator:
                      mapping:
                        base64: '#/components/schemas/MediaInputBase64'
                        url: '#/components/schemas/MediaInputUrl'
                      propertyName: type
                    oneOf:
                    - $ref: '#/components/schemas/MediaInputUrl'
                    - $ref: '#/components/schemas/MediaInputBase64'
                  type:
                  - object
                  - 'null'
                tool_schema:
                  anyOf:
                  - items:
                      $ref: '#/components/schemas/OpenaiTool'
                    type: array
                  - items:
                      $ref: '#/components/schemas/AnthropicTool'
                    type: array
                  - items:
                      $ref: '#/components/schemas/VertexTool'
                    type: array
                  - items:
                      $ref: '#/components/schemas/OpenaiResponsesTool'
                    type: array
                  - type: 'null'
                  default: null
                  title: Tool Schema
                session_info:
                  default: null
                  oneOf:
                  - $ref: '#/components/schemas/SessionInfo'
                  - type: 'null'
                trace_info:
                  default: null
                  oneOf:
                  - $ref: '#/components/schemas/TraceInfo'
                  - type: 'null'
                prompt_info:
                  default: null
                  oneOf:
                  - $ref: '#/components/schemas/PromptInfo'
                  - type: 'null'
                call_info:
                  default: null
                  oneOf:
                  - $ref: '#/components/schemas/CallInfo'
                  - type: 'null'
                test_run_info:
                  default: null
                  oneOf:
                  - $ref: '#/components/schemas/TestRunInfo'
                  - type: 'null'
                eval_results:
                  default: null
                  title: Eval Results
                  additionalProperties:
                    anyOf:
                    - type: number
                    - type: boolean
                  type:
                  - object
                  - 'null'
                response_info:
                  default: null
                  oneOf:
                  - $ref: '#/components/schemas/ResponseInfo'
                  - type: 'null'
                completion_id:
                  default: null
                  title: Completion Id
                  format: uuid
                  type:
                  - string
                  - 'null'
                parent_id:
                  default: null
                  title: Parent Id
                  format: uuid
                  type:
                  - string
                  - 'null'
                output_schema:
                  default: null
                  title: Output Schema
                  additionalProperties: true
                  type:
                  - object
                  - 'null'
              required:
              - messages
              title: RecordPayload
              type: object
      operationId: post_record_completion
  /api/v2/projects/{project_id}/sessions/{session_id}/traces/id/{trace_id}:
    post:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                properties: {}
                title: EmptyResponse
                type: object
          description: EmptyResponse()
      description: 'Create or update a trace within a session. Use to group related completions in agent workflows. See SDK method.


        Generate the trace_id client-side (UUID v4) to avoid round-trip latency.'
      summary: Record Trace
      tags:
      - Observability
      requestBody:
        content:
          application/json:
            schema:
              properties:
                input:
                  $ref: '#/components/schemas/JSONValue'
                output:
                  $ref: '#/components/schemas/JSONValue'
                parent_id:
                  default: null
                  title: Parent Id
                  format: uuid
                  type:
                  - string
                  - 'null'
                test_run_info:
                  default: null
                  oneOf:
                  - $ref: '#/components/schemas/TestRunInfo'
                  - type: 'null'
                agent_name:
                  default: null
                  title: Agent Name
                  type:
                  - string
                  - 'null'
                custom_metadata:
                  default: null
                  title: Custom Metadata
                  additionalProperties:
                    anyOf:
                    - type: string
                    - type: number
                    - type: integer
                    - type: boolean
                  type:
                  - object
                  - 'null'
                eval_results:
                  default: null
                  title: Eval Results
                  additionalProperties:
                    anyOf:
                    - type: number
                    - type: boolean
                  type:
                  - object
                  - 'null'
                name:
                  default: null
                  title: Name
                  type:
                  - string
                  - 'null'
                kind:
                  default: null
                  title: Kind
                  const: tool
                  type:
                  - string
                  - 'null'
                start_time:
                  default: null
                  title: Start Time
                  format: date-time
                  type:
                  - string
                  - 'null'
                end_time:
                  default: null
                  title: End Time
                  format: date-time
                  type:
                  - string
                  - 'null'
              required:
              - input
              - output
              title: TracePayload
              type: object
      operationId: post_record_trace
    patch:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  message:
                    title: Message
                    type: string
                required:
                - message
                title: SimpleResponseWithMessage
                type: object
          description: 'SimpleResponseWithMessage(message: str)'
      description: Update a trace's output, metadata, feedback, eval results, and/or test run info by its trace ID.
      summary: Update Trace by ID
      tags:
      - Observability
      requestBody:
        content:
          application/json:
            schema:
              properties:
                output:
                  default: null
                  oneOf:
                  - $ref: '#/components/schemas/JSONValue'
                  - type: 'null'
                metadata:
                  default: null
                  title: Metadata
                  additionalProperties:
                    anyOf:
                    - type: string
                    - type: number
                    - type: integer
                    - type: boolean
                  type:
                  - object
                  - 'null'
                feedback:
                  default: null
                  title: Feedback
                  additionalProperties:
                    anyOf:
                    - type: string
                    - type: number
                    - type: integer
                    - type: boolean
                  type:
                  - object
                  - 'null'
                eval_results:
                  default: null
                  title: Eval Results
                  additionalProperties:
                    anyOf:
                    - type: number
                    - type: boolean
                  type:
                  - object
                  - 'null'
                test_run_info:
                  default: null
                  oneOf:
                  - $ref: '#/components/schemas/TestRunInfo'
                  - type: 'null'
              title: TraceUpdateRequest
              type: object
      operationId: patch_update_trace_by_id
  /api/v2/projects/{project_id}/sessions/{session_id}/traces/id/{trace_id}/metadata:
    patch:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  message:
                    title: Message
                    type: string
                required:
                - message
                title: SimpleResponseWithMessage
                type: object
          description: 'SimpleResponseWithMessage(message: str)'
      description: Merge custom metadata into an existing trace. Use to enrich traces with post-hoc context.
      summary: Update Trace Metadata
      tags:
      - Observability
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                anyOf:
                - type: string
                - type: number
                - type: integer
                - type: boolean
              type: object
      operationId: patch_update_trace_metadata
  /api/v2/projects/{project_id}/sessions/{session_id}/traces/otel-span-id/{otel_span_id_hex}:
    patch:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: otel_span_id_hex
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  message:
                    title: Message
                    type: string
                required:
                - message
                title: SimpleResponseWithMessage
                type: object
          description: 'SimpleResponseWithMessage(message: str)'
      description: 'Update a trace''s output, metadata, feedback, eval results, and/or test run info by its OpenTelemetry span ID (hex string).


        Note: OTEL spans are mapped to Freeplay Traces, so we use the OTEL span ID to identify Traces.'
      summary: Update Trace by OTEL Span ID
      tags:
      - Observability
      requestBody:
        content:
          application/json:
            schema:
              properties:
                output:
                  default: null
                  oneOf:
                  - $ref: '#/components/schemas/JSONValue'
                  - type: 'null'
                metadata:
                  default: null
                  title: Metadata
                  additionalProperties:
                    anyOf:
                    - type: string
                    - type: number
                    - type: integer
                    - type: boolean
                  type:
                  - object
                  - 'null'
                feedback:
                  default: null
                  title: Feedback
                  additionalProperties:
                    anyOf:
                    - type: string
                    - type: number
                    - type: integer
                    - type: boolean
                  type:
                  - object
                  - 'null'
                eval_results:
                  default: null
                  title: Eval Results
                  additionalProperties:
                    anyOf:
                    - type: number
                    - type: boolean
                  type:
                  - object
                  - 'null'
                test_run_info:
                  default: null
                  oneOf:
                  - $ref: '#/components/schemas/TestRunInfo'
                  - type: 'null'
              title: TraceUpdateRequest
              type: object
      operationId: patch_update_trace_by_otel_span_id
  /api/v2/projects/{project_id}/completions/{completion_id}:
    post:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: completion_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  completion_id:
                    description: The session entry ID
                    format: uuid
                    title: Completion Id
                    type: string
                required:
                - completion_id
                title: RecordCompletionInfo
                type: object
          description: 'RecordCompletionInfo(completion_id: uuid.UUID = FieldInfo(annotation=NoneType, required=True, description=''The session entry ID''))'
      description: Append messages or evaluation results to an existing completion. Use for streaming responses or adding post-hoc evaluation metrics.
      summary: Update Completion
      tags:
      - Observability
      requestBody:
        content:
          application/json:
            schema:
              properties:
                new_messages:
                  anyOf:
                  - items:
                      discriminator:
                        mapping:
                          assistant: '#/components/schemas/OpenAIAssistantMessage'
                          developer: '#/components/schemas/OpenAIDeveloperMessage'
                          system: '#/components/schemas/OpenAISystemMessage'
                          tool: '#/components/schemas/OpenAIToolMessage'
                          user: '#/components/schemas/OpenAIUserMessage'
                        propertyName: role
                      oneOf:
                      - $ref: '#/components/schemas/OpenAISystemMessage'
                      - $ref: '#/components/schemas/OpenAIDeveloperMessage'
                      - $ref: '#/components/schemas/OpenAIUserMessage'
                      - $ref: '#/components/schemas/OpenAIAssistantMessage'
                      - $ref: '#/components/schemas/OpenAIToolMessage'
                    type: array
                  - items:
                      $ref: '#/components/schemas/AnthropicMessage'
                    type: array
                  - items:
                      $ref: '#/components/schemas/SimpleProviderMessage'
                    type: array
                  - items:
                      $ref: '#/components/schemas/VertexMessage'
                    type: array
                  - items:
                      $ref: '#/components/schemas/BedrockConverseMessage'
                    type: array
                  - items:
                      anyOf:
                      - oneOf:
                        - $ref: '#/components/schemas/OpenAIResponsesMessageItem'
                        - $ref: '#/components/schemas/OpenAIResponsesFunctionCallItem'
                        - $ref: '#/components/schemas/OpenAIResponsesFunctionCallOutputItem'
                        - $ref: '#/components/schemas/OpenAIResponsesReasoningItem'
                        - $ref: '#/components/schemas/OpenAIResponsesBuiltinToolItem'
                      - $ref: '#/components/schemas/SimpleProviderMessage'
                    type: array
                  - type: 'null'
                  default: null
                  title: New Messages
                eval_results:
                  default: null
                  title: Eval Results
                  additionalProperties:
                    anyOf:
                    - type: number
                    - type: boolean
                  type:
                  - object
                  - 'null'
              title: RecordUpdatePayload
              type: object
      operationId: post_update
  /api/v2/projects/{project_id}/completion-feedback/id/{completion_id}:
    post:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: completion_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  message:
                    title: Message
                    type: string
                required:
                - message
                title: SimpleResponseWithMessage
                type: object
          description: 'SimpleResponseWithMessage(message: str)'
      description: 'Record end-user feedback on a completion. Use to capture thumbs up/down ratings or custom feedback attributes. See SDK method.


        The `freeplay_feedback` field must be "positive" or "negative". Additional custom fields are supported.'
      summary: Add Completion Feedback
      tags:
      - Observability
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                anyOf:
                - type: string
                - type: number
                - type: integer
                - type: boolean
              type: object
      operationId: post_create_completion_feedback
  /api/v2/projects/{project_id}/trace-feedback/id/{trace_id}:
    post:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  message:
                    title: Message
                    type: string
                required:
                - message
                title: SimpleResponseWithMessage
                type: object
          description: 'SimpleResponseWithMessage(message: str)'
      description: 'Record end-user feedback on a trace. Use to capture feedback on conversation turns or agent workflow outcomes. See SDK method.


        The `freeplay_feedback` field must be "positive" or "negative". Additional custom fields are supported.'
      summary: Add Trace Feedback
      tags:
      - Observability
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                anyOf:
                - type: string
                - type: number
                - type: integer
                - type: boolean
              type: object
      operationId: post_trace_feedback
components:
  schemas:
    AnthropicFileBlock:
      properties:
        source:
          discriminator:
            mapping:
              base64: '#/components/schemas/AnthropicBase64Source'
              url: '#/components/schemas/AnthropicURLSource'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/AnthropicBase64Source'
          - $ref: '#/components/schemas/AnthropicURLSource'
          title: Source
        type:
          const: document
          default: document
          title: Type
          type: string
      required:
      - source
      title: AnthropicFileBlock
      type: object
    AnthropicURLSource:
      properties:
        url:
          title: Url
          type: string
        type:
          const: url
          default: url
          title: Type
          type: string
      required:
      - url
      title: AnthropicURLSource
      type: object
    OpenAIToolCall:
      properties:
        id:
          title: Id
          type: string
        function:
          $ref: '#/components/schemas/OpenAIFunction'
        type:
          const: function
          default: function
          title: Type
          type: string
      required:
      - id
      - function
      title: OpenAIToolCall
      type: object
    BedrockConverseMessage:
      properties:
        role:
          enum:
          - user
          - assistant
          title: Role
          type: string
        content:
          items:
            oneOf:
            - $ref: '#/components/schemas/BedrockTextBlock'
            - $ref: '#/components/schemas/BedrockJsonBlock'
            - $ref: '#/components/schemas/BedrockImageBlock'
            - $ref: '#/components/schemas/BedrockDocumentBlock'
            - $ref: '#/components/schemas/BedrockToolUseBlock'
            - $ref: '#/components/schemas/BedrockToolResultBlock'
          title: Content
          type: array
      required:
      - role
      - content
      title: BedrockConverseMessage
      type: object
    ApiStyle:
      enum:
      - batch
      - default
      title: ApiStyle
      type: string
    BedrockJsonBlock:
      properties:
        json:
          $ref: '#/components/schemas/JSONValue'
        type:
          const: json
          default: json
          title: Type
          type: string
      required:
      - json
      title: BedrockJsonBlock
      type: object
    AnthropicImageBlock:
      properties:
        source:
          discriminator:
            mapping:
              base64: '#/components/schemas/AnthropicBase64Source'
              url: '#/components/schemas/AnthropicURLSource'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/AnthropicBase64Source'
          - $ref: '#/components/schemas/AnthropicURLSource'
          title: Source
        type:
          const: image
          default: image
          title: Type
          type: string
      required:
      - source
      title: AnthropicImageBlock
      type: object
    VertexFunctionCallPart:
      properties:
        functionCall:
          $ref: '#/components/schemas/VertexFunctionCall'
        thoughtSignature:
          default: null
          title: Thoughtsignature
          type:
          - string
          - 'null'
      required:
      - functionCall
      title: VertexFunctionCallPart
      type: object
    BedrockImageBlock:
      properties:
        image:
          $ref: '#/components/schemas/BedrockImageContent'
        type:
          const: image
          default: image
          title: Type
          type: string
      required:
      - image
      title: BedrockImageBlock
      type: object
    TestRunInfo:
      properties:
        test_run_id:
          format: uuid
          title: Test Run Id
          type: string
        test_case_id:
          format: uuid
          title: Test Case Id
          type: string
      required:
      - test_run_id
      - test_case_id
      title: TestRunInfo
      type: object
    BedrockImageContent:
      properties:
        format:
          title: Format
          type: string
        source:
          $ref: '#/components/schemas/BedrockSource'
      required:
      - format
      - source
      title: BedrockImageContent
      type: object
    BedrockDocumentContent:
      properties:
        format:
          title: Format
          type: string
        name:
          title: Name
          type: string
        source:
          $ref: '#/components/schemas/BedrockSource'
      required:
      - format
      - name
      - source
      title: BedrockDocumentContent
      type: object
    VertexFunctionResponse:
      properties:
        name:
          title: Name
          type: string
        response:
          $ref: '#/components/schemas/JSONValue'
      required:
      - name
      - response
      title: VertexFunctionResponse
      type: object
    SessionInfo:
      properties:
        custom_metadata:
          default: null
          title: Custom Metadata
          additionalProperties:
            anyOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
          type:
          - object
          - 'null'
      title: SessionInfo
      type: object
    AnthropicTextBlock:
      properties:
        text:
          title: Text
          type: string
        type:
          const: text
          default: text
          title: Type
          type: string
      required:
      - text
      title: AnthropicTextBlock
      type: object
    SimpleProviderMessage:
      properties:
        role:
          anyOf:
          - const: system
            type: string
          - const: developer
            type: string
          - const: user
            type: string
          - const: assistant
            type: string
          title: Role
        content:
          title: Content
          type: string
      required:
      - role
      - content
      title: SimpleProviderMessage
      type: object
    VertexInlineData:
      properties:
        mimeType:
          title: Mimetype
          type: string
        data:
          title: Data
          type: string
      required:
      - mimeType

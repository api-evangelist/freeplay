          description: EmptyResponse()
      description: Deactivate a code evaluation criteria without deleting it.
      summary: Disable Code Evaluation Criteria
      tags:
      - Evaluation Criteria
      operationId: patch_disable_code_eval_criteria
  /api/v2/projects/{project_id}/evaluation-criteria/code/{criteria_id}/enable:

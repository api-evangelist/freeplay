openapi: 3.2.0
info:
  title: Freeplay Evaluation Criteria API
  version: 0.1.0
security:
- BearerAuth: []
tags:
- name: Evaluation Criteria
paths:
  /api/v2/projects/{project_id}/evaluation-criteria:
    post:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  id:
                    format: uuid
                    title: Id
                    type: string
                required:
                - id
                title: CreateEvaluationCriteriaResponse
                type: object
          description: 'CreateEvaluationCriteriaResponse(id: uuid.UUID)'
      description: Create a new evaluation criteria in a project. Use to set up criteria for evaluating LLM outputs in test runs or online evaluations.
      summary: Create Evaluation Criteria
      tags:
      - Evaluation Criteria
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  title: Name
                  type: string
                target_type:
                  $ref: '#/components/schemas/TargetType'
                target_id:
                  format: uuid
                  title: Target Id
                  type: string
                type:
                  $ref: '#/components/schemas/AutoEvalCriteriaType'
                llm_eval_enabled:
                  title: Llm Eval Enabled
                  type: boolean
                id:
                  default: null
                  title: Id
                  format: uuid
                  type:
                  - string
                  - 'null'
              required:
              - name
              - target_type
              - target_id
              - type
              - llm_eval_enabled
              title: CreateEvaluationCriteriaRequest
              type: object
      operationId: post_create_evaluation_criteria
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          default: 1
          title: Page
          type: integer
      - name: page_size
        in: query
        schema:
          default: 30
          title: Page Size
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/EvaluationCriteriaInfo'
                    title: Data
                    type: array
                  pagination:
                    $ref: '#/components/schemas/PaginationInfo'
                required:
                - data
                - pagination
                title: EvaluationCriteriaListResponse
                type: object
          description: 'EvaluationCriteriaListResponse(data: list[server.api_routes.evaluation_criteria_api_v2.EvaluationCriteriaInfo], pagination: server.api_routes.api_v2_common.PaginationInfo)'
      description: 'Retrieve all evaluation criteria in a project. Use to discover available criteria or build criteria management UIs.


        `page_size` defaults to 30, maximum 100.'
      summary: List Evaluation Criteria
      tags:
      - Evaluation Criteria
      operationId: get_list_evaluation_criteria
  /api/v2/projects/{project_id}/evaluation-criteria/code:
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          default: 1
          title: Page
          type: integer
      - name: page_size
        in: query
        schema:
          default: 30
          title: Page Size
          type: integer
      - name: target_type
        in: query
        schema:
          default: null
          oneOf:
          - $ref: '#/components/schemas/TargetType'
          - type: 'null'
      - name: target_id
        in: query
        schema:
          default: null
          title: Target Id
          format: uuid
          type:
          - string
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/CodeEvalCriteriaInfo'
                    title: Data
                    type: array
                  pagination:
                    $ref: '#/components/schemas/PaginationInfo'
                required:
                - data
                - pagination
                title: CodeEvalListResponse
                type: object
          description: 'CodeEvalListResponse(data: list[server.api_routes.code_eval_criteria_api_v2.CodeEvalCriteriaInfo], pagination: server.api_routes.api_v2_common.PaginationInfo)'
      description: 'Retrieve all code evaluation criteria in a project. Optionally filter by target type and ID.


        `page_size` defaults to 30, maximum 100.'
      summary: List Code Evaluation Criteria
      tags:
      - Evaluation Criteria
      operationId: get_list_code_eval_criteria
    post:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  id:
                    format: uuid
                    title: Id
                    type: string
                  name:
                    title: Name
                    type: string
                  description:
                    title: Description
                    type:
                    - string
                    - 'null'
                  target_type:
                    $ref: '#/components/schemas/TargetType'
                  target_id:
                    format: uuid
                    title: Target Id
                    type: string
                  criteria_type:
                    $ref: '#/components/schemas/AutoEvalCriteriaType'
                  sample_rate:
                    title: Sample Rate
                    type:
                    - number
                    - 'null'
                  is_enabled:
                    title: Is Enabled
                    type: boolean
                  generate_insights:
                    title: Generate Insights
                    type: boolean
                  deployed_version:
                    $ref: '#/components/schemas/CodeEvalVersionSummary'
                  latest_version:
                    $ref: '#/components/schemas/CodeEvalVersionSummary'
                required:
                - id
                - name
                - description
                - target_type
                - target_id
                - criteria_type
                - sample_rate
                - is_enabled
                - generate_insights
                - deployed_version
                - latest_version
                title: CreateCodeEvalResponse
                type: object
          description: 'CreateCodeEvalResponse(id: uuid.UUID, name: str, description: Optional[str], target_type: shared.common.TargetType, target_id: uuid.UUID, criteria_type: shared.sqlalchemy.models.AutoEvalCriteriaType, sample_rate: Optional[float], is_enabled: bool, generate_insights: bool, deployed_version: server.api_routes.code_eval_criteria_api_v2.CodeEvalVersionSummary, latest_version: server.api_routes.code_eval_criteria_api_v2.CodeEvalVersionSummary)'
      description: Create a new code evaluation criteria with an initial auto-deployed version.
      summary: Create Code Evaluation Criteria
      tags:
      - Evaluation Criteria
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  title: Name
                  type: string
                description:
                  title: Description
                  type: string
                target_type:
                  $ref: '#/components/schemas/TargetType'
                target_id:
                  format: uuid
                  title: Target Id
                  type: string
                eval_code:
                  title: Eval Code
                  type: string
                criteria_type:
                  $ref: '#/components/schemas/AutoEvalCriteriaType'
                sample_rate:
                  default: 0.0
                  title: Sample Rate
                  type: number
                generate_insights:
                  default: true
                  title: Generate Insights
                  type: boolean
                language:
                  $ref: '#/components/schemas/CodeEvalLanguage'
                  default: python
              required:
              - name
              - description
              - target_type
              - target_id
              - eval_code
              - criteria_type
              title: CreateCodeEvalRequest
              type: object
      operationId: post_create_code_eval_criteria
  /api/v2/projects/{project_id}/evaluation-criteria/code/{criteria_id}:

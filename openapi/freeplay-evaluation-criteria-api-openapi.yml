                  version_number:
                    title: Version Number
                    type: integer
                  is_deployed:
                    title: Is Deployed
                    type: boolean
                  created_at:
                    title: Created At
                    type: integer
                  sample_rate:
                    title: Sample Rate
                    type:
                    - number
                    - 'null'
                  target:
                    $ref: '#/components/schemas/EvaluationCriteriaTarget'
                  created_by_user:
                    oneOf:
                    - $ref: '#/components/schemas/UserInfo'
                    - type: 'null'
                  position:
                    title: Position
                    type:
                    - number
                    - 'null'
                  is_enabled:
                    title: Is Enabled
                    type: boolean
                  generate_insights:
                    title: Generate Insights
                    type: boolean
                  criteria_description:
                    title: Criteria Description
                    type:
                    - string
                    - 'null'
                  eval_code:
                    title: Eval Code
                    type:
                    - string
                    - 'null'
                  language:
                    oneOf:
                    - $ref: '#/components/schemas/CodeEvalLanguage'
                    - type: 'null'
                required:
                - id
                - version_id
                - name
                - type
                - version_number
                - is_deployed
                - created_at
                - sample_rate
                - target
                - created_by_user
                - position
                - is_enabled
                - generate_insights
                - criteria_description
                - eval_code
                - language

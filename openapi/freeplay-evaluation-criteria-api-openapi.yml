                  id:
                    format: uuid
                    title: Id
                    type: string
                  name:
                    title: Name
                    type: string
                  description:
                    title: Description
                    type:
                    - string
                    - 'null'
                  target_type:
                    $ref: '#/components/schemas/TargetType'
                  target_id:
                    format: uuid
                    title: Target Id
                    type: string
                  criteria_type:
                    $ref: '#/components/schemas/AutoEvalCriteriaType'
                  sample_rate:
                    title: Sample Rate
                    type:
                    - number
                    - 'null'
                  is_enabled:
                    title: Is Enabled
                    type: boolean
                  generate_insights:
                    title: Generate Insights
                    type: boolean
                  deployed_version:
                    $ref: '#/components/schemas/CodeEvalVersionSummary'
                  latest_version:
                    $ref: '#/components/schemas/CodeEvalVersionSummary'
                required:
                - id
                - name
                - description
                - target_type
                - target_id
                - criteria_type
                - sample_rate
                - is_enabled
                - generate_insights
                - deployed_version
                - latest_version
                title: CreateCodeEvalResponse
                type: object
          description: 'CreateCodeEvalResponse(id: uuid.UUID, name: str, description: Optional[str], target_type: shared.common.TargetType, target_id: uuid.UUID, criteria_type: shared.sqlalchemy.models.AutoEvalCriteriaType, sample_rate: Optional[float], is_enabled: bool, generate_insights: bool, deployed_version: server.api_routes.code_eval_criteria_api_v2.CodeEvalVersionSummary, latest_version: server.api_routes.code_eval_criteria_api_v2.CodeEvalVersionSummary)'
      description: Update criteria-level metadata. Does not create a new version.
      summary: Update Code Evaluation Criteria
      tags:
      - Evaluation Criteria
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  default: null
                  title: Name
                  type:
                  - string
                  - 'null'
                description:
                  default: null
                  title: Description
                  type:
                  - string
                  - 'null'
                sample_rate:
                  default: null
                  title: Sample Rate
                  type:
                  - number
                  - 'null'
                generate_insights:
                  default: null
                  title: Generate Insights
                  type:
                  - boolean
                  - 'null'
              title: PatchCodeEvalRequest
              type: object
      operationId: patch_patch_code_eval_criteria
    delete:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: criteria_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties: {}
                title: EmptyResponse
                type: object
          description: EmptyResponse()
      description: Permanently delete a code evaluation criteria and all its versions.
      summary: Delete Code Evaluation Criteria
      tags:
      - Evaluation Criteria
      operationId: delete_delete_code_eval_criteria
  /api/v2/projects/{project_id}/evaluation-criteria/code/{criteria_id}/disable:

      description: Create a new version of an existing code evaluation criteria. The version is not deployed until published.
      summary: Create Code Evaluation Criteria Version
      tags:
      - Evaluation Criteria
      requestBody:
        content:
          application/json:
            schema:
              properties:
                eval_code:
                  title: Eval Code
                  type: string
              required:

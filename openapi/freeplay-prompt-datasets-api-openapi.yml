openapi: 3.2.0
info:
  title: Freeplay Prompt Datasets API
  version: 0.1.0
security:
- BearerAuth: []
tags:
- name: Prompt Datasets
paths:
  /api/v2/projects/{project_id}/datasets/id/{dataset_id}/test-cases:
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          default: null
          title: Page
          type:
          - string
          - 'null'
      - name: page_size
        in: query
        schema:
          default: null
          title: Page Size
          type:
          - string
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TestCaseInfo'
                type: array
          description: 'Built-in mutable sequence.


            If no argument is given, the constructor creates a new empty list.

            The argument must be an iterable if specified.'
      description: '`page_size` defaults to 10, maximum 10.'
      summary: List Prompt Test Cases
      tags:
      - Prompt Datasets
      operationId: get_get_test_cases_by_id
    post:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  message:
                    title: Message
                    type: string
                required:
                - message
                title: SimpleResponseWithMessage
                type: object
          description: 'SimpleResponseWithMessage(message: str)'
      description: 'Add test cases to a dataset using the legacy upload format. Use for bulk imports with input/output pairs.


        Maximum 100 examples per request.'
      summary: Upload Prompt Test Cases
      tags:
      - Prompt Datasets
      requestBody:
        content:
          application/json:
            schema:
              properties:
                examples:
                  items:
                    $ref: '#/components/schemas/TestCaseUploadWithMedia'
                  title: Examples
                  type: array
              required:
              - examples
              title: TestCasesUploadRequest
              type: object
      operationId: post_upload_test_cases
  /api/v2/projects/{project_id}/datasets/name/{dataset_name}/test-cases:
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_name
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          default: null
          title: Page
          type:
          - string
          - 'null'
      - name: page_size
        in: query
        schema:
          default: null
          title: Page Size
          type:
          - string
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TestCaseInfo'
                type: array
          description: 'Built-in mutable sequence.


            If no argument is given, the constructor creates a new empty list.

            The argument must be an iterable if specified.'
      description: '`page_size` defaults to 10, maximum 10.'
      summary: List Prompt Test Cases by Dataset Name
      tags:
      - Prompt Datasets
      operationId: get_get_test_cases_by_name
  /api/v2/projects/{project_id}/prompt-datasets/{dataset_id}/test-cases:
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          default: 1
          title: Page
          type: integer
      - name: page_size
        in: query
        schema:
          default: 30
          title: Page Size
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/PromptTestCaseResponse'
                    title: Data
                    type: array
                  pagination:
                    $ref: '#/components/schemas/PaginationInfo'
                required:
                - data
                - pagination
                title: PromptTestCasesListResponse
                type: object
          description: 'PromptTestCasesListResponse(data: list[server.api_routes.prompt_datasets_api_v2.PromptTestCaseResponse], pagination: server.api_routes.api_v2_common.PaginationInfo)'
      description: 'Retrieve all row-level test cases in a prompt dataset. Use to review dataset contents or export for analysis.


        `page_size` defaults to 30, maximum 100.'
      summary: List Prompt Test Cases
      tags:
      - Prompt Datasets
      operationId: get_get_prompt_dataset_test_cases
  /api/v2/projects/{project_id}/prompt-datasets/{dataset_id}/test-cases/bulk:
    post:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/PromptTestCaseResponse'
                    title: Data
                    type: array
                required:
                - data
                title: CreatePromptTestCasesResponse
                type: object
          description: 'CreatePromptTestCasesResponse(data: list[server.api_routes.prompt_datasets_api_v2.PromptTestCaseResponse])'
      description: 'Add multiple test cases to a dataset in a single request. Use for batch imports, e.g. from CSV or production logs.


        Maximum 100 test cases per request.'
      summary: Bulk Create Prompt Test Cases
      tags:
      - Prompt Datasets
      requestBody:
        content:
          application/json:
            schema:
              properties:
                data:
                  items:
                    $ref: '#/components/schemas/PromptTestCase'
                  title: Data
                  type: array
              required:
              - data
              title: CreatePromptTestCasesRequest
              type: object
      operationId: post_bulk_create_prompt_dataset_test_cases
    delete:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties: {}
                title: EmptyResponse
                type: object
          description: EmptyResponse()
      description: 'Remove multiple test cases in a single request. Use for batch cleanup operations.


        Maximum 100 test cases per request.'
      summary: Bulk Delete Prompt Test Cases
      tags:
      - Prompt Datasets
      requestBody:
        content:
          application/json:
            schema:
              properties:
                test_case_ids:
                  items:
                    format: uuid
                    type: string
                  title: Test Case Ids
                  type: array
              required:
              - test_case_ids
              title: BulkDeletePromptTestCasesRequest
              type: object
      operationId: delete_bulk_delete_prompt_dataset_test_cases
  /api/v2/projects/{project_id}/prompt-datasets/{dataset_id}/test-cases/{test_case_id}:
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
      - name: test_case_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    format: uuid
                    title: Id
                    type: string
                  inputs:
                    additionalProperties: true
                    title: Inputs
                    type: object
                  output:
                    default: null
                    title: Output
                    type:
                    - string
                    - 'null'
                  output_message:
                    anyOf:
                    - discriminator:
                        mapping:
                          assistant: '#/components/schemas/AssistantMessageInfo'
                          developer: '#/components/schemas/DeveloperMessageInfo'
                          system: '#/components/schemas/SystemMessageInfo'
                          user: '#/components/schemas/UserMessageInfo'
                        propertyName: role
                      oneOf:
                      - $ref: '#/components/schemas/UserMessageInfo'
                      - $ref: '#/components/schemas/SystemMessageInfo'
                      - $ref: '#/components/schemas/DeveloperMessageInfo'
                      - $ref: '#/components/schemas/AssistantMessageInfo'
                    - $ref: '#/components/schemas/UserMessage'
                    - $ref: '#/components/schemas/AssistantMessage'
                    - $ref: '#/components/schemas/SystemMessage'
                    - $ref: '#/components/schemas/DeveloperMessage'
                    - type: 'null'
                    default: null
                    title: Output Message
                  metadata:
                    default: null
                    title: Metadata
                    additionalProperties:
                      anyOf:
                      - type: string
                      - type: number
                      - type: integer
                      - type: boolean
                    type:
                    - object
                    - 'null'
                  media_inputs:
                    default: null
                    title: Media Inputs
                    additionalProperties:
                      $ref: '#/components/schemas/MediaInputBase64'
                    type:
                    - object
                    - 'null'
                  history:
                    default: null
                    title: History
                    items:
                      anyOf:
                      - discriminator:
                          mapping:
                            assistant: '#/components/schemas/AssistantMessageInfo'
                            developer: '#/components/schemas/DeveloperMessageInfo'
                            system: '#/components/schemas/SystemMessageInfo'
                            user: '#/components/schemas/UserMessageInfo'
                          propertyName: role
                        oneOf:
                        - $ref: '#/components/schemas/UserMessageInfo'
                        - $ref: '#/components/schemas/SystemMessageInfo'
                        - $ref: '#/components/schemas/DeveloperMessageInfo'
                        - $ref: '#/components/schemas/AssistantMessageInfo'
                      - $ref: '#/components/schemas/UserMessage'
                      - $ref: '#/components/schemas/AssistantMessage'
                      - $ref: '#/components/schemas/SystemMessage'
                      - $ref: '#/components/schemas/DeveloperMessage'
                    type:
                    - array
                    - 'null'
                required:
                - id
                - inputs
                title: PromptTestCaseResponse
                type: object
          description: 'PromptTestCaseResponse(test_case: shared.sqlalchemy.models.TestCase, media_inputs: Optional[dict[str, server.project_sessions.types.MediaInputBase64]])'
      description: Retrieve a specific test case (dataset row) by ID. Use to inspect test case details or debug test run results.
      summary: Get Prompt Test Case
      tags:
      - Prompt Datasets
      operationId: get_get_prompt_dataset_test_case
    patch:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
      - name: test_case_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    format: uuid
                    title: Id
                    type: string
                  inputs:
                    additionalProperties: true
                    title: Inputs
                    type: object
                  output:
                    default: null
                    title: Output
                    type:
                    - string
                    - 'null'
                  output_message:
                    anyOf:
                    - discriminator:
                        mapping:
                          assistant: '#/components/schemas/AssistantMessageInfo'
                          developer: '#/components/schemas/DeveloperMessageInfo'
                          system: '#/components/schemas/SystemMessageInfo'
                          user: '#/components/schemas/UserMessageInfo'
                        propertyName: role
                      oneOf:
                      - $ref: '#/components/schemas/UserMessageInfo'
                      - $ref: '#/components/schemas/SystemMessageInfo'
                      - $ref: '#/components/schemas/DeveloperMessageInfo'
                      - $ref: '#/components/schemas/AssistantMessageInfo'
                    - $ref: '#/components/schemas/UserMessage'
                    - $ref: '#/components/schemas/AssistantMessage'
                    - $ref: '#/components/schemas/SystemMessage'
                    - $ref: '#/components/schemas/DeveloperMessage'
                    - type: 'null'
                    default: null
                    title: Output Message
                  metadata:
                    default: null
                    title: Metadata
                    additionalProperties:
                      anyOf:
                      - type: string
                      - type: number
                      - type: integer
                      - type: boolean
                    type:
                    - object
                    - 'null'
                  media_inputs:
                    default: null
                    title: Media Inputs
                    additionalProperties:
                      $ref: '#/components/schemas/MediaInputBase64'
                    type:
                    - object
                    - 'null'
                  history:
                    default: null
                    title: History
                    items:
                      anyOf:
                      - discriminator:
                          mapping:
                            assistant: '#/components/schemas/AssistantMessageInfo'
                            developer: '#/components/schemas/DeveloperMessageInfo'
                            system: '#/components/schemas/SystemMessageInfo'
                            user: '#/components/schemas/UserMessageInfo'
                          propertyName: role
                        oneOf:
                        - $ref: '#/components/schemas/UserMessageInfo'
                        - $ref: '#/components/schemas/SystemMessageInfo'
                        - $ref: '#/components/schemas/DeveloperMessageInfo'
                        - $ref: '#/components/schemas/AssistantMessageInfo'
                      - $ref: '#/components/schemas/UserMessage'
                      - $ref: '#/components/schemas/AssistantMessage'
                      - $ref: '#/components/schemas/SystemMessage'
                      - $ref: '#/components/schemas/DeveloperMessage'
                    type:
                    - array
                    - 'null'
                required:
                - id
                - inputs
                title: PromptTestCaseResponse
                type: object
          description: 'PromptTestCaseResponse(test_case: shared.sqlalchemy.models.TestCase, media_inputs: Optional[dict[str, server.project_sessions.types.MediaInputBase64]])'
      description: Modify an existing test case's inputs, output, or metadata. Use to change ground truth output values or correct errors.
      summary: Update Prompt Test Case
      tags:
      - Prompt Datasets
      requestBody:
        content:
          application/json:
            schema:
              properties:
                inputs:
                  default: null
                  title: Inputs
                  additionalProperties: true
                  type:
                  - object
                  - 'null'
                output:
                  default: null
                  title: Output
                  type:
                  - string
                  - 'null'
                metadata:
                  default: null
                  title: Metadata
                  additionalProperties:
                    anyOf:
                    - type: string
                    - type: number
                    - type: integer
                    - type: boolean
                  type:
                  - object
                  - 'null'
                history:
                  default: null
                  title: History
                  items:
                    discriminator:
                      mapping:
                        assistant: '#/components/schemas/AssistantMessage'
                        developer: '#/components/schemas/DeveloperMessage'
                        system: '#/components/schemas/SystemMessage'
                        user: '#/components/schemas/UserMessage'
                      propertyName: role
                    oneOf:
                    - $ref: '#/components/schemas/UserMessage'
                    - $ref: '#/components/schemas/SystemMessage'
                    - $ref: '#/components/schemas/DeveloperMessage'
                    - $ref: '#/components/schemas/AssistantMessage'
                  type:
                  - array
                  - 'null'
                media_inputs:
                  default: null
                  title: Media Inputs
                  additionalProperties:
                    discriminator:
                      mapping:
                        base64: '#/components/schemas/MediaInputBase64'
                        url: '#/components/schemas/MediaInputUrl'
                      propertyName: type
                    oneOf:
                    - $ref: '#/components/schemas/MediaInputUrl'
                    - $ref: '#/components/schemas/MediaInputBase64'
                  type:
                  - object
                  - 'null'
              title: UpdatePromptTestCaseRequest
              type: object
      operationId: patch_update_prompt_dataset_test_case
    delete:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
      - name: test_case_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties: {}
                title: EmptyResponse
                type: object
          description: EmptyResponse()
      description: Remove a test case from a dataset. Use to clean up invalid or outdated test cases.
      summary: Delete Prompt Test Case
      tags:
      - Prompt Datasets
      operationId: delete_delete_prompt_dataset_test_case
  /api/v2/projects/{project_id}/datasets/id/{dataset_id}:
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    format: uuid
                    title: Id
                    type: string
                  name:
                    title: Name
                    type: string
                  description:
                    title: Description
                    type: string
                required:
                - id
                - name
                - description
                title: TestListInfo
                type: object
          description: 'TestListInfo(test_list: shared.sqlalchemy.models.Dataset)'
      description: ''
      summary: Get Prompt Dataset
      tags:
      - Prompt Datasets
      operationId: get_get_by_id
  /api/v2/projects/{project_id}/datasets/name/{dataset_name}:
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    format: uuid
                    title: Id
                    type: string
                  name:
                    title: Name
                    type: string
                  description:
                    title: Description
                    type: string
                required:
                - id
                - name
                - description
                title: TestListInfo
                type: object
          description: 'TestListInfo(test_list: shared.sqlalchemy.models.Dataset)'
      description: ''
      summary: Get Prompt Dataset by Name
      tags:
      - Prompt Datasets
      operationId: get_get_by_name
  /api/v2/projects/{project_id}/prompt-datasets:
    post:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  id:
                    format: uuid
                    title: Id
                    type: string
                  name:
                    title: Name
                    type: string
                  input_names:
                    items:
                      type: string
                    title: Input Names
                    type: array
                  media_input_names:
                    items:
                      type: string
                    title: Media Input Names
                    type: array
                  support_history:
                    title: Support History
                    type: boolean
                  description:
                    default: null
                    title: Description
                    type:
                    - string
                    - 'null'
                  tags:
                    default: null
                    items:
                      $ref: '#/components/schemas/TagResponse'
                    title: Tags
                    type: array
                required:
                - id
                - name
                - input_names
                - media_input_names
                - support_history
                title: PromptDatasetResponse
                type: object
          description: 'PromptDatasetResponse(dataset: shared.sqlalchemy.models.Dataset, tags: Optional[list[''TagResponse'']] = None)'
      description: Create a new dataset for prompt-level testing. Use to organize test cases for evaluating individual prompts.
      summary: Create Prompt-Level Dataset
      tags:
      - Prompt Datasets
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  title: Name
                  type: string
                description:
                  default: null
                  title: Description
                  type:
                  - string
                  - 'null'
                input_names:
                  default: null
                  title: Input Names
                  items:
                    type: string
                  type:
                  - array
                  - 'null'
                media_input_names:
                  default: null
                  title: Media Input Names
                  items:
                    type: string
                  type:
                  - array
                  - 'null'
                support_history:
                  default: false
                  title: Support History
                  type: boolean
                tags:
                  default: null
                  title: Tags
                  items:
                    type: string
                  type:
                  - array
                  - 'null'
              required:
              - name
              title: CreatePromptDatasetRequest
              type: object
      operationId: post_create_prompt_dataset
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          default: 1
          title: Page
          type: integer
      - name: page_size
        in: query
        schema:
          default: 30
          title: Page Size
          type: integer
      - name: id
        in: query
        schema:
          default: null
          title: Id
          format: uuid
          type:
          - string
          - 'null'
      - name: name
        in: query
        schema:
          default: null
          title: Name
          type:
          - string
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/PromptDatasetResponse'
                    title: Data
                    type: array
                  pagination:
                    $ref: '#/components/schemas/PaginationInfo'
                required:
                - data
                - pagination
                title: PromptDatasetsListResponse
                type: object
          description: 'PromptDatasetsListResponse(data: list[server.api_routes.prompt_datasets_api_v2.PromptDatasetResponse], pagination: server.api_routes.api_v2_common.PaginationInfo)'
      description: 'Retrieve all prompt-level datasets in a project. Use to discover available datasets for test runs.


        `page_size` defaults to 30, maximum 100.'
      summary: List Prompt Datasets
      tags:
      - Prompt Datasets
      operationId: get_get_prompt_datasets
  /api/v2/projects/{project_id}/prompt-datasets/{dataset_id}:
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    format: uuid
                    title: Id
                    type: string
                  name:
                    title: Name
                    type: string
                  input_names:
                    items:
                      type: string
                    title: Input Names
                    type: array
                  media_input_names:
                    items:
                      type: string
                    title: Media Input Names
                    type: array
                  support_history:
                    title: Support History
                    type: boolean
                  description:
                    default: null
                    title: Description
                    type:
                    - string
                    - 'null'
                  tags:
                    default: null
                    items:
                      $ref: '#/components/schemas/TagResponse'
                    title: Tags
                    type: array
                required:
                - id
                - name
                - input_names
                - media_input_names
                - support_history
                title: PromptDatasetResponse
                type: object
          description: 'PromptDatasetResponse(dataset: shared.sqlalchemy.models.Dataset, tags: Optional[list[''TagResponse'']] = None)'
      description: Retrieve a prompt dataset's metadata by ID. Use to check dataset configuration or input schema.
      summary: Get Prompt Dataset
      tags:
      - Prompt Datasets
      operationId: get_get_prompt_dataset
    patch:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    format: uuid
                    title: Id
                    type: string
                  name:
                    title: Name
                    type: string
                  input_names:
                    items:
                      type: string
                    title: Input Names
                    type: array
                  media_input_names:
                    items:
                      type: string
                    title: Media Input Names
                    type: array
                  support_history:
                    title: Support History
                    type: boolean
                  description:
                    default: null
                    title: Description
                    type:
                    - string
                    - 'null'
                  tags:
                    default: null
                    items:
                      $ref: '#/components/schemas/TagResponse'
                    title: Tags
                    type: array
                required:
                - id
                - name
                - input_names
                - media_input_names
                - support_history
                title: PromptDatasetResponse
                type: object
          description: 'PromptDatasetResponse(dataset: shared.sqlalchemy.models.Dataset, tags: Optional[list[''TagResponse'']] = None)'
      description: Modify a prompt dataset's name, description, or input schema. Use to evolve datasets as prompt requirements change.
      summary: Update Prompt Dataset
      tags:
      - Prompt Datasets
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  default: null
                  title: Name
                  type:
                  - string
                  - 'null'
                description:
                  default: null
                  title: Description
                  type:
                  - string
                  - 'null'
                input_names:
                  default: null
                  title: Input Names
                  items:
                    type: string
                  type:
                  - array
                  - 'null'
                media_input_names:
                  default: null
                  title: Media Input Names
                  items:
                    type: string
                  type:
                  - array
                  - 'null'
                support_history:
                  default: null
                  title: Support History
                  type:
                  - boolean
                  - 'null'

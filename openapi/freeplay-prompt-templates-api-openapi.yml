tags:
- name: Prompt Templates
paths:
  /api/v2/projects/{project_id}/prompt-templates/id/{template_id}/versions:
    post:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: template_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  prompt_template_id:
                    format: uuid
                    title: Prompt Template Id
                    type: string
                  prompt_template_version_id:
                    format: uuid
                    title: Prompt Template Version Id
                    type: string
                  prompt_template_name:
                    title: Prompt Template Name
                    type: string
                  version_name:
                    title: Version Name
                    type:
                    - string
                    - 'null'
                  version_description:
                    title: Version Description
                    type:
                    - string
                    - 'null'
                  metadata:
                    $ref: '#/components/schemas/PromptTemplateMetadata'
                  format_version:
                    title: Format Version
                    type: integer
                  project_id:
                    format: uuid
                    title: Project Id
                    type: string
                  content:
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/ChatMessageWithMediaSlot'
                      - $ref: '#/components/schemas/ChatMessage'
                      - $ref: '#/components/schemas/HistoryPlaceholder'
                    title: Content
                    type: array
                  tool_schema:
                    title: Tool Schema
                    items:
                      $ref: '#/components/schemas/NormalizedToolSchema'
                    type:
                    - array
                    - 'null'
                  output_schema:
                    title: Output Schema
                    additionalProperties: true
                    type:
                    - object
                    - 'null'
                required:
                - prompt_template_id
                - prompt_template_version_id
                - prompt_template_name
                - version_name
                - version_description
                - metadata
                - format_version
                - project_id
                - content
                - tool_schema
                - output_schema
                title: PlainPromptTemplate
                type: object
          description: 'PlainPromptTemplate(prompt_template_id: uuid.UUID, prompt_template_version_id: uuid.UUID, prompt_template_name: str, version_name: Optional[str], version_description: Optional[str], metadata: server.api_routes.prompt_templates_api_v2.PromptTemplateMetadata, format_version: int, project_id: uuid.UUID, content: list[typing.Union[server.project_sessions.prompt_template_model.ChatMessageWithMediaSlot, server.project_sessions.prompt_template_model.ChatMessage, server.project_sessions.prompt_template_model.HistoryPlaceholder]], tool_schema: Optional[list[shared.common.NormalizedToolSchema]], output_schema: Optional[dict[str, Any]])'
      description: 'Create a new version of an existing prompt template. Freeplay assigns a random ID. Use when you have the template ID from a previous API call.


        **Version Creation Semantics:**


        A new version is created only if there is no existing version with identical:

        - Content (prompt messages)

        - Model

        - LLM parameters

        - Version name (if provided)

        - Version description

        - Tool schema

        - Output schema


        If an identical version exists in any of the target environments, that version is reused and its environments are updated to match the requested environments. This ensures you never create duplicate versions with the same configuration.


        **Environment Deployment:**


        - When creating a new version, it will be deployed to the specified environments (or "latest" if none specified)

        - When reuploading an existing prompt template with a new environment, the environments on that prompt template version will be updated


        These checks are performed so that you can safely upload prompt templates without worrying that you will be creating duplicate versions. This is especially useful in development workflows where your prompts are stored in code.'
      summary: Create prompt template version by ID
      tags:
      - Prompt Templates
      requestBody:
        content:
          application/json:
            schema:
              properties:
                template_messages:
                  items:
                    anyOf:
                    - $ref: '#/components/schemas/PromptTemplateMessageInfo'
                    - $ref: '#/components/schemas/HistoryPlaceholderInfo'
                  title: Template Messages
                  type: array
                model:
                  title: Model
                  type: string
                provider:
                  title: Provider
                  type: string
                version_name:
                  default: null
                  title: Version Name
                  type:
                  - string
                  - 'null'
                version_description:
                  default: null
                  title: Version Description
                  type:
                  - string
                  - 'null'
                llm_parameters:
                  default: null
                  title: Llm Parameters
                  additionalProperties:
                    anyOf:
                    - type: string
                    - type: integer
                    - type: number
                    - additionalProperties: true
                      type: object
                  type:
                  - object
                  - 'null'
                tool_schema:
                  default: null
                  title: Tool Schema
                  items:
                    $ref: '#/components/schemas/NormalizedToolSchema'
                  type:
                  - array
                  - 'null'
                output_schema:
                  default: null
                  title: Output Schema
                  additionalProperties: true
                  type:
                  - object
                  - 'null'
                environments:
                  default: null
                  title: Environments
                  items:
                    type: string
                  type:
                  - array
                  - 'null'
              required:
              - template_messages
              - model
              - provider
              title: CreateTemplateVersionRequest
              type: object
      operationId: post_create_template_version_by_id
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: template_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          default: 1
          title: Page
          type: integer
      - name: page_size
        in: query
        schema:
          default: 30
          title: Page Size
          type: integer
      - name: from_version
        in: query
        schema:
          default: null
          title: From Version
          type:
          - string
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/PlainPromptTemplate'
                    title: Data
                    type: array
                  pagination:
                    $ref: '#/components/schemas/PaginationInfo'
                required:
                - data
                - pagination
                title: PromptTemplateVersionListResponse
                type: object
          description: 'PromptTemplateVersionListResponse(data: list[server.api_routes.prompt_templates_api_v2.PlainPromptTemplate], pagination: server.api_routes.api_v2_common.PaginationInfo)'
      description: 'Retrieve all versions of a prompt template. Use to view version history or compare changes over time.


        `page_size` defaults to 30, maximum 100.'
      summary: List prompt template versions
      tags:
      - Prompt Templates
      operationId: get_list_prompt_template_versions

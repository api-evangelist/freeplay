openapi: 3.2.0
info:
  title: Freeplay Test Runs API
  version: 0.1.0
security:
- BearerAuth: []
tags:
- name: Test Runs
paths:
  /api/v2/projects/{project_id}/test-runs:
    post:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  test_run_id:
                    title: Test Run Id
                    type: string
                  test_run_name:
                    title: Test Run Name
                    type: string
                  test_run_description:
                    title: Test Run Description
                    type: string
                  test_cases:
                    title: Test Cases
                    items:
                      $ref: '#/components/schemas/TestCaseInfo'
                    type:
                    - array
                    - 'null'
                  trace_test_cases:
                    title: Trace Test Cases
                    items:
                      $ref: '#/components/schemas/TraceTestCaseInfo'
                    type:
                    - array
                    - 'null'
                required:
                - test_run_id
                - test_run_name
                - test_run_description
                - test_cases
                - trace_test_cases
                title: TestRunWithTestCasesInfo
                type: object
          description: 'TestRunWithTestCasesInfo(test_run_id: str, test_run_name: str, test_run_description: str, test_cases: Optional[list[server.api_routes.test_runs_api_v2.TestCaseInfo]], trace_test_cases: Optional[list[server.api_routes.test_runs_api_v2.TraceTestCaseInfo]])'
      description: ''
      summary: Create Test Run
      tags:
      - Test Runs
      requestBody:
        content:
          application/json:
            schema:
              properties:
                dataset_name:
                  title: Dataset Name
                  type: string
                include_outputs:
                  default: null
                  title: Include Outputs
                  type:
                  - boolean
                  - 'null'
                test_run_name:
                  default: null
                  title: Test Run Name
                  type:
                  - string
                  - 'null'
                test_run_description:
                  default: null
                  title: Test Run Description
                  type:
                  - string
                  - 'null'
                flavor_name:
                  default: null
                  title: Flavor Name
                  type:
                  - string
                  - 'null'
                target_evaluation_ids:
                  default: null
                  title: Target Evaluation Ids
                  items:
                    format: uuid
                    type: string
                  type:
                  - array
                  - 'null'
              required:
              - dataset_name
              title: CreateTestRunInfo
              type: object
      operationId: post_create_with_test_cases
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          default: 1
          title: Page
          type:
          - integer
          - 'null'
      - name: page_size
        in: query
        schema:
          default: 100
          title: Page Size
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  test_runs:
                    items:
                      $ref: '#/components/schemas/TestRunInfo'
                    title: Test Runs
                    type: array
                required:
                - test_runs
                title: TestRunListResponseInfo
                type: object
          description: 'TestRunListResponseInfo(test_runs: list[shared.sqlalchemy.models.TestRun])'
      description: '`page_size` defaults to 100, maximum 100.'
      summary: List Test Runs
      tags:
      - Test Runs
      operationId: get_get_test_runs
  /api/v2/projects/{project_id}/test-runs/id/{test_run_id}:
    get:
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: test_run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    title: Id
                    type: string
                  name:
                    title: Name
                    type:
                    - string
                    - 'null'
                  description:
                    title: Description
                    type:
                    - string
                    - 'null'
                  created_at:
                    title: Created At
                    type:
                    - integer
                    - 'null'
                  prompt_name:
                    title: Prompt Name
                    type:
                    - string
                    - 'null'
                  prompt_version:
                    title: Prompt Version
                    type:
                    - string
                    - 'null'
                  model_name:
                    title: Model Name
                    type:
                    - string
                    - 'null'
                  sessions_count:
                    title: Sessions Count
                    type:
                    - integer
                    - 'null'
                  summary_statistics:
                    $ref: '#/components/schemas/SummaryStatistics'
                  status:
                    default: null
                    title: Status
                    type:
                    - string
                    - 'null'
                required:
                - id
                - name
                - description
                - created_at
                - prompt_name
                - prompt_version
                - model_name
                - sessions_count
                - summary_statistics
                title: TestRunResponseInfo
                type: object
          description: 'TestRunResponseInfo(test_run_summary_info: server.test_runs.test_runs_service.TestRunSummaryInfo, summary_statistics: server.test_runs.test_runs_service.SummaryStatistics)'
      description: ''
      summary: Get Test Run Results
      tags:
      - Test Runs
      operationId: get_get_test_run_results
